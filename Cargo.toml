[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/IFLoom/twee-tools"
edition = "2024"
version = "0.1.0"
publish = false

[profile.release]
strip = true
lto = "thin"

[profile.profiling]
inherits = "release"
debug = true
strip = false
