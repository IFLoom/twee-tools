[package]
name = "media"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
story = { path = "../story" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "rayon"] }
webp = { version = "0.3", default-features = false }
rayon = "1"
html-escape = "0.2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
check = { path = "../check" }
story = { path = "../story" }
