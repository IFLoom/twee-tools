# A pushed tag vX.Y.Z (made by scripts/release.sh): build twee-tools for each system, then publish a GitHub release with
# the archives, the bare binaries `twee-tools upgrade` fetches, a checksums file and the install scripts.
# Run by hand (Actions → Release → Run workflow), it builds and packages everything and publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # The tag must name the version Cargo.toml gives, and the changelog must have its section.
      - id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match Cargo.toml's version, $version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static binaries (musl), which run on any distribution, built with Zig as the C compiler for libwebp.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true, runs: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true, runs: false }
          - { target: aarch64-apple-darwin, os: macos-latest, runs: true }
          - { target: x86_64-apple-darwin, os: macos-latest, runs: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, runs: true }
    env:
      NAME: twee-tools-${{ matrix.target }}
      EXE: ${{ contains(matrix.target, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: pip3 install --user cargo-zigbuild

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = true ]; then build=zigbuild; else build=build; fi
          cargo $build --release --locked -p twee-tools --target ${{ matrix.target }}

      # Where this runner can run the binary: does it start, and does it make and build a new project?
      - name: Try it
        if: matrix.runs
        shell: bash
        run: |
          bin="$PWD/target/${{ matrix.target }}/release/twee-tools$EXE"
          "$bin" --version
          mkdir "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          "$bin" init demo && cd demo && "$bin" build
          test -s dist/index.html

      - name: Package
        shell: bash
        run: |
          mkdir -p dist "$NAME"
          cp "target/${{ matrix.target }}/release/twee-tools$EXE" "$NAME/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$NAME/"
          python3 scripts/notices.py --target ${{ matrix.target }} > "$NAME/THIRD-PARTY-NOTICES.md"
          if [ -n "$EXE" ]; then
            7z a -tzip -bso0 "dist/$NAME.zip" "$NAME"
          else
            tar -czf "dist/$NAME.tar.gz" "$NAME"
          fi
          # The bare binary, which `twee-tools upgrade` downloads.
          cp "$NAME/twee-tools$EXE" "dist/$NAME$EXE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/*
          if-no-files-found: error

  # The install scripts, against these builds served from the runner itself as a stand-in for the release.
  install:
    name: Install scripts and npm (${{ matrix.os }})
    needs: [version, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      TWEE_TOOLS_DOWNLOAD_URL: http://127.0.0.1:8791
      TWEE_TOOLS_INSTALL_DIR: ${{ github.workspace }}/installed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Serve the builds
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          (cd dist && $sum * > SHA256SUMS)
          python3 -m http.server 8791 --bind 127.0.0.1 -d dist >/dev/null 2>&1 &
          sleep 2
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          sh scripts/install.sh
          sh scripts/install.sh   # again, as an upgrade does
          "$TWEE_TOOLS_INSTALL_DIR/twee-tools" --version
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./scripts/install.ps1   # again, as an upgrade does
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:TWEE_TOOLS_INSTALL_DIR/twee-tools.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The npm packages, made from these builds, installed into a new project as npm would, and run through npx.
      - name: npm
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 scripts/npm-packages.py --version "$VERSION" --dist dist --out "$RUNNER_TEMP/npm"
          system=$(node -p "process.platform + '-' + process.arch")
          (cd "$RUNNER_TEMP/npm/twee-tools-$system" && npm pack --silent --pack-destination "$RUNNER_TEMP")
          (cd "$RUNNER_TEMP/npm/twee-tools" && npm pack --silent --pack-destination "$RUNNER_TEMP")
          mkdir "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project" && npm init -y >/dev/null
          npm install --save-dev "$RUNNER_TEMP/ifloom-twee-tools-$system-$VERSION.tgz" "$RUNNER_TEMP/ifloom-twee-tools-$VERSION.tgz"
          npx twee-tools --version | grep -F "twee-tools $VERSION"
          npx twee-tools init demo && cd demo && npx twee-tools build && test -s dist/index.html

  publish:
    name: Publish
    needs: [version, build, install]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          # The version `twee-tools upgrade` reads from the latest release.
          echo "$VERSION" > dist/VERSION
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
          # The release's notes: its section of the changelog.
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "v$VERSION" dist/* --title "twee-tools $VERSION" --notes-file notes.md --verify-tag

  # The npm packages, after the GitHub release: each system's, then @ifloom/twee-tools, which depends on them. Each version
  # already on npm is left as it is, so a run can be repeated. Publishing needs the NPM_TOKEN secret (an npm token that
  # can publish to the @ifloom scope); without it this says so and skips. Provenance needs a public repository.
  npm:
    name: npm
    needs: [version, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::No NPM_TOKEN secret, so nothing was published to npm."
            exit 0
          fi
          python3 scripts/npm-packages.py --version "$VERSION" --dist dist --out npm-out
          provenance=$([ "$PRIVATE" = false ] && echo --provenance || true)
          for folder in npm-out/twee-tools-* npm-out/twee-tools; do
            name=$(node -p "require('./$folder/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm"
            else
              (cd "$folder" && npm publish --access public $provenance)
            fi
          done
